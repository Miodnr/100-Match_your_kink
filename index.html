      margin-top: 20px;

    .results h2 {

      color: #ffffff;

    button {

      color: white;
      border: none;

    .match-item {

    { active: "Erotisches Spielzeug (Vibratoren, Aufleger) am Partner anwenden", passive: "Erotisches Spielzeug am eigenen Körper angewendet bekommen" },

    { active: "Ausgiebigen Oralverkehr geben (Fellatio oder Cunnilingus)", passive: "Ausgiebigen Oralverkehr empfangen (Fellatio oder Cunnilingus)" },

    { active: "Rollenspiel Chef/Angestellte(r) aktiv steuern", passive: "Rollenspiel Chef/Angestellte(r) als Untergebene(r) mitspielen" },
    { active: "Rollenspiel Lehrer/Schüler(in) oder Erzieher(in) aktiv führen", passive: "Rollenspiel Lehrer/Schüler(in) in der maßgeregelten Rolle spielen" },
    { active: "Den Partner als 'Fremde(n)' in einer Bar/Hotel ansprechen und verführen", passive: "Als 'Fremde(r)' in einer Bar/Hotel angesprochen und verführt werden" },
    { active: "Schlafsex (Somnophilie): Den schlafenden Partner sanft verführen/wecken", passive: "Schlafsex (Somnophilie): Im Schlaf sanft verführt/geweckt werden" },

    // --- KOMMUNIKATION & VISUALS (3 Paare = 6 Fragen) ---
    { active: "Aktiv schmutzigen Dirty Talk sprechen und Anweisungen geben", passive: "Schmutzigen Dirty Talk und Anweisungen vom Partner hören" },
    { active: "Den Partner auffordern, einen Striptease vorzugrenzen", passive: "Einen Striptease für den Partner vorführen" },
    { active: "Erotische Fotos/Videos vom Partner mit dessen Einverständnis machen", passive: "Mich vom Partner für erotische Fotos/Videos in Szene setzen lassen" }
  ];

  // =========================================================
  // AUTOMATISCHER AUFBAU ALLER 100 FRAGEN
  // =========================================================
  let questions = [];
  questionPairs.forEach((item, pIdx) => {
    questions.push({ text: item.active, pairIdx: pIdx, role: 'active', otherText: item.passive });
    questions.push({ text: item.passive, pairIdx: pIdx, role: 'passive', otherText: item.active });
  });

  const cardColors = [
    "#c2410c", "#854d0e", "#9f1239", "#b45309", 
    "#831843", "#9a3412", "#701a75", "#a16207"
  ];

  let currentAnswers = [];
  let currentIndex = 0;
  let partnerAnswers = null;

  const urlParams = new URLSearchParams(window.location.search);
  const p1Data = urlParams.get('p1');
  if (p1Data) {
    try {
      partnerAnswers = JSON.parse(atob(decodeURIComponent(p1Data)));
    } catch (e) {
      console.error("Ungültige Daten im Share-Link");
    }
  }

  const card = document.getElementById('activeCard');
  const questionText = document.getElementById('questionText');
  const progressText = document.getElementById('progressText');
  const badgeYes = card.querySelector('.badge-yes');
  const badgeNo = card.querySelector('.badge-no');
  const badgeSuper = card.querySelector('.badge-super');

  let startX = 0, startY = 0;
  let currentX = 0, currentY = 0;
  let isDragging = false;

  function showQuestion() {
    if (currentIndex < questions.length) {
      questionText.innerText = questions[currentIndex].text;
      progressText.innerText = `Frage ${currentIndex + 1} / ${questions.length}`;
      const colorIndex = currentIndex % cardColors.length;
      card.style.backgroundColor = cardColors[colorIndex];
      resetCardPosition();
    } else {
      finishQuiz();
    }
  }

  function resetCardPosition() {
    card.style.transform = 'translate(0px, 0px) rotate(0deg)';
    badgeYes.style.opacity = 0;
    badgeNo.style.opacity = 0;
    badgeSuper.style.opacity = 0;
  }

  function startDrag(x, y) {
    isDragging = true;
    startX = x;
    startY = y;
  }

  function moveDrag(x, y) {
    if (!isDragging) return;
    currentX = x - startX;
    currentY = y - startY;

    let rotate = currentX * 0.04;
    card.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rotate}deg)`;

    if (currentY < -80 && Math.abs(currentX) < 100) {
      badgeSuper.style.opacity = Math.min(Math.abs(currentY) / 120, 1);
      badgeYes.style.opacity = 0;
      badgeNo.style.opacity = 0;
    } else if (currentX > 50) {
      badgeYes.style.opacity = Math.min(currentX / 100, 1);
      badgeNo.style.opacity = 0;
      badgeSuper.style.opacity = 0;
    } else if (currentX < -50) {
      badgeNo.style.opacity = Math.min(Math.abs(currentX) / 100, 1);
      badgeYes.style.opacity = 0;
      badgeSuper.style.opacity = 0;
    } else {
      badgeYes.style.opacity = 0;
      badgeNo.style.opacity = 0;
      badgeSuper.style.opacity = 0;
    }
  }

  function endDrag() {
    if (!isDragging) return;
    isDragging = false;

    const threshold = 100;
    if (currentY < -threshold && Math.abs(currentX) < 120) {
      answer(2);
    } else if (currentX > threshold) {
      answer(1);
    } else if (currentX < -threshold) {
      answer(0);
    } else {
      resetCardPosition();
    }
  }

  function answer(val) {
    currentAnswers.push(val);
    currentIndex++;
    showQuestion();
  }

  card.addEventListener('touchstart', e => startDrag(e.touches[0].clientX, e.touches[0].clientY));
  card.addEventListener('touchmove', e => moveDrag(e.touches[0].clientX, e.touches[0].clientY));
  card.addEventListener('touchend', endDrag);

  card.addEventListener('mousedown', e => startDrag(e.clientX, e.clientY));
  document.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
  document.addEventListener('mouseup', endDrag);

  function finishQuiz() {
    document.getElementById('quizContainer').style.display = 'none';
    document.getElementById('hint').style.display = 'none';
    const resultsDiv = document.getElementById('results');
    const content = document.getElementById('resultsContent');
    resultsDiv.style.display = 'block';

    if (!partnerAnswers) {
      const encoded = encodeURIComponent(btoa(JSON.stringify(currentAnswers)));
      const shareUrl = `${window.location.origin}${window.location.pathname}?p1=${encoded}`;

      content.innerHTML = `
        <p style="font-size: 1.2rem; font-weight: 800;">Du hast alle 100 Fragen beantwortet!</p>
        <p style="font-size: 0.95rem; color: #bfae9c;">Sende diesen Link an deinen Partner / deine Partnerin, um eure Ergebnisse abzugleichen:</p>
        <button onclick="navigator.clipboard.writeText('${shareUrl}'); alert('Link in die Zwischenablage kopiert!');">
          Link kopieren 📋
        </button>
      `;
    } else {
      let matchesHtml = "<h3 style='color: #ffffff; font-size: 1.3rem;'>Eure Übereinstimmungen:</h3>";
      let matchCount = 0;

      let flatIndex = 0;
      questionPairs.forEach((pair) => {
        const actIdx = flatIndex;
        const passIdx = flatIndex + 1;
        flatIndex += 2;

        const p1Act = partnerAnswers[actIdx] || 0;
        const p1Pass = partnerAnswers[passIdx] || 0;
        const p2Act = currentAnswers[actIdx] || 0;
        const p2Pass = currentAnswers[passIdx] || 0;

        const dir1 = (p1Act > 0 && p2Pass > 0);
        const dir2 = (p1Pass > 0 && p2Act > 0);

        if (dir1 || dir2) {
          matchCount++;
          const isSuper = (p1Act === 2 || p1Pass === 2 || p2Act === 2 || p2Pass === 2);
          const cssClass = isSuper ? "match-super" : "match-yes";
          let detailText = "";

          if (dir1 && dir2) {
            detailText = `🔄 <strong>Wechsel-Match!</strong> Beide sind offen für beide Rollen (Aktiv & Passiv).`;
          } else if (dir1) {
            detailText = `Partner(in) möchte: <em>${pair.active}</em><br>Du möchtest: <em>${pair.passive}</em>`;
          } else if (dir2) {
            detailText = `Du möchtest: <em>${pair.active}</em><br>Partner(in) möchte: <em>${pair.passive}</em>`;
          }

          matchesHtml += `
            <div class="match-item ${cssClass}">
              <strong>${isSuper ? "🌟 Super Match!" : "✅ Match!"}</strong>
              <div class="match-detail">${detailText}</div>
            </div>
          `;
        }
      });

      if (matchCount === 0) {
        matchesHtml += "<p style='color: #bfae9c;'>Keine direkten Übereinstimmungen gefunden.</p>";
      }

      content.innerHTML = matchesHtml;
    }
  }

  showQuestion();
</script>
</body>
</html>
